name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate every suite shipped in the repo
        # The CLI is part of the contract, not only the library behind it.
        run: python -m beval validate $(find suites -name '*.json' | sort)
      - name: Score the fixture run end to end
        run: |
          python -m beval score suites/support-triage/suite.json \
            tests/fixtures/runs/support-triage-fixture.json \
            --prices tests/fixtures/prices-fixture.json
      - name: Replay the committed record end to end
        # The runner path with no credentials and no boto3 installed: build every request,
        # read every recorded answer, write a run file, and score it.
        run: |
          python -m beval run suites/support-triage/suite.json \
            --replay tests/fixtures/records/support-triage-record.json \
            --out replayed-run.json
          python -m beval score suites/support-triage/suite.json replayed-run.json
      - name: Refuse a replay whose question changed
        # A record is only evidence while the request still matches. Assert the refusal,
        # not the success: a replay that answers anything is a cache, not a recording.
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("tests/fixtures/records/support-triage-record.json")
          record = json.loads(p.read_text())
          record["exchanges"][0]["request"]["system"] = [{"text": "a different system prompt"}]
          pathlib.Path("drifted-record.json").write_text(json.dumps(record))
          PY
          if python -m beval run suites/support-triage/suite.json \
               --replay drifted-record.json --out /dev/null; then
            echo "::error::replay served an answer to a question it never recorded"
            exit 1
          fi
          echo "drifted replay refused, as intended"
      - name: Refuse placeholder prices
        # The guard only works if it is still wired up; assert the failure, not the success.
        run: |
          if python -m beval score suites/support-triage/suite.json \
               tests/fixtures/runs/support-triage-fixture.json \
               --prices pricing.example.json; then
            echo "::error::placeholder price list was accepted"
            exit 1
          fi
          echo "placeholder price list refused, as intended"

  scope-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Removed public definitions must be named in the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/scope_guard.py "$BASE_SHA" "$HEAD_SHA"

  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse credentials and recorded runs
        run: |
          set -euo pipefail
          # AWS keys, bearer tokens, and anything under runs/ (live output, never committed).
          if git grep -nIE 'AKIA[0-9A-Z]{16}|aws_secret_access_key[[:space:]]*=|BEGIN [A-Z ]*PRIVATE KEY' -- . ; then
            echo "::error::credential-shaped string found in the tree"
            exit 1
          fi
          if git ls-files | grep -E '^runs/' ; then
            echo "::error::runs/ holds live output and must stay out of the repository"
            exit 1
          fi
          echo "clean"
